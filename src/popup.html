<!DOCTYPE html>
<html lang="pt-BR" class="boot popup">
<head>
<meta charset="utf-8">
<title>Pouso</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-style="brasa" data-layout="canto">
<script src="boot.js"></script>
<div id="palette" class="palette open in-popup" role="dialog" aria-label="Pouso">
  <div class="palette-box">
    <div class="palette-field">
      <span class="search-ico" aria-hidden="true"></span>
      <input id="pq" type="text" role="combobox" aria-expanded="true" aria-controls="presults" aria-autocomplete="list" spellcheck="false" autocomplete="off" autofocus>
      <kbd>Esc</kbd>
    </div>
    <ul id="presults" role="listbox"></ul>
    <p class="palette-foot"></p>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="platform.js"></script>
<script src="i18n.js"></script>
<script src="palette.js"></script>
<script src="ui.js"></script>
<script src="temas.js"></script>
<script src="quick.js"></script>
<script src="popup.js"></script>
</body>
</html>
